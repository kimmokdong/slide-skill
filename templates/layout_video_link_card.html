<section>
    <div class="video-link-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; gap: 1.5rem;">
        <h2 style="margin: 0; font-size: 2.5rem; text-align: center; color: var(--color-text);">{{TITLE}}</h2>
        
        <div class="video-card card" style="display: flex; flex-direction: column; width: 60%; max-width: 600px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: var(--color-card-bg);">
            <div class="thumbnail-wrapper" style="width: 100%; aspect-ratio: 16/9; position: relative; background: #000; display: flex; align-items: center; justify-content: center;">
                <img src="{{THUMBNAIL_URL}}" alt="Video Thumbnail" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.8;">
                <a href="{{WATCH_URL}}" target="_blank" style="position: absolute; width: 80px; height: 80px; background: rgba(255,0,0,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s;">
                    <div style="width: 0; height: 0; border-style: solid; border-width: 15px 0 15px 25px; border-color: transparent transparent transparent #ffffff; margin-left: 8px;"></div>
                </a>
            </div>
            <div style="padding: 1.5rem; text-align: center;">
                <a href="{{WATCH_URL}}" target="_blank" style="display: inline-block; padding: 0.8rem 2rem; background: var(--color-accent); color: white; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 1.2rem;">YouTube에서 열기</a>
            </div>
        </div>
        
        <div class="video-hook-prompt" style="text-align: center; max-width: 80%;">
            <p style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--color-accent); font-weight: bold;">{{PURPOSE}}</p>
            <p style="font-size: 1.2rem; margin: 0;">{{STUDENT_TASK}}</p>
        </div>
    </div>
</section>
