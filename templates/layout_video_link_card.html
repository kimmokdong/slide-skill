<section>
    <div class="slide-container video-layout video-link-layout">
        <div class="slide-header">
            <h2 data-edit-id="TITLE">{{TITLE}}</h2>
        </div>
        <div class="slide-body video-layout-body">
            <div class="video-link-card card">
                <a class="video-thumbnail-link" href="{{WATCH_URL}}" target="_blank" rel="noopener">
                    <img src="{{THUMBNAIL_URL}}" alt="{{TITLE}} 영상 미리보기">
                    <span class="video-play-mark" aria-hidden="true">▶</span>
                </a>
                <a class="video-open-link" href="{{WATCH_URL}}" target="_blank" rel="noopener">YouTube에서 열기</a>
            </div>
            {{#if PURPOSE}}
            <p class="video-purpose" data-edit-id="PURPOSE">{{PURPOSE}}</p>
            {{/if}}
            {{#if STUDENT_TASK}}
            <p class="video-student-task" data-edit-id="STUDENT_TASK">{{STUDENT_TASK}}</p>
            {{/if}}
        </div>
    </div>
</section>
