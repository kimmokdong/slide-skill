<!-- 레이아웃: 짧은 답안 예시 확인 -->
<section>
    <div class="slide-container sample-answer-reveal-layout">
        <div class="slide-header">
            <h2 data-edit-id="TITLE">{{TITLE}}</h2>
        </div>
        <div class="slide-body">
            <div class="sample-answer-reveal-body">
                <div class="sample-answer-prompt" data-edit-id="{{PROMPT_EDIT_ID}}">{{PROMPT}}</div>
                <div class="sample-answer-box fragment">
                    <div class="sample-answer-label">예시 답안</div>
                    <div class="sample-answer-text" data-edit-id="{{SAMPLE_ANSWER_EDIT_ID}}">{{SAMPLE_ANSWER}}</div>
                </div>
            </div>
        </div>
        {{BOTTOM_TAKEAWAY_HTML}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
