<section>
    <div class="slide-container video-layout video-hook-layout">
        <div class="slide-header">
            <h2 data-edit-id="TITLE">{{TITLE}}</h2>
        </div>
        <div class="slide-body video-layout-body">
            <div class="video-frame card">
                <iframe src="{{EMBED_URL}}" title="YouTube video player" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            {{#if PURPOSE}}
            <p class="video-purpose" data-edit-id="PURPOSE">{{PURPOSE}}</p>
            {{/if}}
            {{#if STUDENT_TASK}}
            <p class="video-student-task" data-edit-id="STUDENT_TASK">{{STUDENT_TASK}}</p>
            {{/if}}
        </div>
    </div>
</section>
