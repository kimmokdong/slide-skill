<!-- 레이아웃: 활동 안내 -->
<section>
    <div class="slide-container activity-instruction-layout">
        <div class="slide-header">
            <h2 data-edit-id="TITLE">{{TITLE}}</h2>
        </div>
        <div class="activity-instruction-body">
            <div class="activity-instruction-card card">
                <div class="activity-kicker" data-edit-id="WORKSHEET_REF">{{WORKSHEET_REF}}</div>
                {{#if THINK_QUESTION}}
                <div class="activity-think-question" style="margin-top:0.5em; margin-bottom: 0.8em; padding: 0.8em; background: rgba(245, 158, 11, 0.1); border-radius: var(--border-radius); border-left: 4px solid var(--color-accent);">
                    <span style="font-size:0.7em; color:var(--color-accent); font-weight:bold; display:block; margin-bottom:0.3em;">🤔 생각할 점</span>
                    <p data-edit-id="THINK_QUESTION" style="font-size:0.85em; font-weight:700; color:var(--color-text); margin:0;">{{THINK_QUESTION}}</p>
                </div>
                {{/if}}
                <p class="activity-main-instruction" data-edit-id="INSTRUCTION">{{INSTRUCTION}}</p>
                {{#if TIMER_MINUTES}}
                <div class="activity-timer">
                    <span>시간</span>
                    <strong data-edit-id="TIMER_MINUTES">{{TIMER_MINUTES}}</strong>
                </div>
                {{/if}}
            </div>
        </div>
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
