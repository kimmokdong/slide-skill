<!-- 레이아웃: OX 정답 확인 -->
<section>
    <div class="slide-container ox-reveal-layout">
        <div class="slide-header">
            <h2 data-edit-id="TITLE">{{TITLE}}</h2>
        </div>
        <div class="slide-body ox-reveal-overview {{OX_REVEAL_DENSITY_CLASS}} js-ox-reveal" data-ox-step="0">
            {{OX_OVERVIEW_ITEMS}}
        </div>
        <div class="ox-focus-layer" aria-hidden="true">
            {{OX_FOCUS_ITEMS}}
        </div>
        {{BOTTOM_TAKEAWAY_HTML}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
