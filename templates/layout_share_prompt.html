<!-- 레이아웃: 자기점검 및 나눔 발문 -->
<section>
    <div class="slide-container share-prompt-layout">
        <div class="slide-header">
            <h2 data-edit-id="TITLE">{{TITLE}}</h2>
        </div>
        <div class="slide-body">
            <div class="share-prompt-body">
                <div class="share-prompt-card card">
                    <div class="share-icon">🗣️</div>
                    <p class="share-instruction" data-edit-id="INSTRUCTION">{{INSTRUCTION}}</p>
                </div>
                <div class="share-questions">
                    {{SHARE_QUESTIONS_HTML}}
                </div>
            </div>
        </div>
        {{BOTTOM_TAKEAWAY_HTML}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
