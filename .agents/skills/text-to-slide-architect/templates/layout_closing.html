<!-- 레이아웃: Closing (마무리) -->
<section class="closing-layout-slide">
    <style>
        .closing-layout-slide .bullet-list {
            align-items: center !important;
            text-align: center !important;
        }
        .closing-layout-slide .bullet-list li {
            justify-content: center !important;
            text-align: center !important;
            width: 100% !important;
        }
        .closing-layout-slide .bullet-list li.icon-bullet {
            justify-content: center !important;
        }
    </style>
    <div class="center-layout" style="font-size: 44px; padding: 1.2em 1.5em; justify-content: center;">
        <div class="hero-badge" style="margin-bottom: 0.6em;">THANK YOU</div>
        <h1 style="font-size: 1.6em; margin-bottom: 0.4em; line-height: 1.2;">{{TITLE}}</h1>
        {{#if MESSAGE}}
        <h2 style="font-size: 1.0em; font-weight: 300; margin-bottom: 0.6em; opacity: 0.85; line-height: 1.4;">{{MESSAGE}}</h2>
        {{/if}}
        {{#if BULLET_ITEMS}}
        <div class="closing-bullets" style="width: 85%; margin: 0.6em auto 0; text-align: center; background: var(--color-card-bg); padding: 0.8em 1.2em; border-radius: 16px; border: 1px solid var(--color-card-border);">
            <ul class="bullet-list" style="font-size: 0.75em; gap: 0.6em;">
                {{BULLET_ITEMS}}
            </ul>
        </div>
        {{/if}}
        {{#if CTA}}
        <div class="hero-badge" style="background: var(--color-accent-secondary); margin-top: 0.5em; font-size: 0.75em; padding: 0.4em 1.2em; border-radius: 24px;">
            {{CTA}}
        </div>
        {{/if}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
