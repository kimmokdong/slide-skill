<!-- 레이아웃: Hero (표지) -->
<section>
    <div class="center-layout">
        {{#if BADGE}}
        <div class="hero-badge">{{BADGE}}</div>
        {{/if}}
        <h1 data-edit-id="TITLE">{{TITLE}}</h1>
        {{#if SUBTITLE}}
        <h2 data-edit-id="SUBTITLE">{{SUBTITLE}}</h2>
        {{/if}}
        {{#if PRESENTER}}
        <p class="presenter" data-edit-id="PRESENTER">👤 {{PRESENTER}}</p>
        {{/if}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
