<!-- 레이아웃: Hero (표지) -->
<section>
    <div class="center-layout">
        {{#if BADGE}}
        <div class="hero-badge">{{BADGE}}</div>
        {{/if}}
        <h1>{{TITLE}}</h1>
        {{#if SUBTITLE}}
        <h2>{{SUBTITLE}}</h2>
        {{/if}}
        {{#if PRESENTER}}
        <p class="presenter">👤 {{PRESENTER}}</p>
        {{/if}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
