<!-- 레이아웃: O/X 대조 비교 (vs_ox) -->
<section>
    <div class="slide-container">
        <div class="slide-header" style="text-align: center;">
            <h2>{{TITLE}}</h2>
        </div>
        <div class="slide-body">
            <div class="ox-layout {{OX_DENSITY_CLASS}}">
                <!-- O (옳은/좋은) 쪽 -->
                <div class="ox-column">
                    <div class="ox-column-header o-header">
                        <span class="ox-header-marker">⭕</span>
                        <h3 style="margin: 0;">{{O_TITLE}}</h3>
                    </div>
                    <div class="ox-column-body">
                        {{O_ITEMS}}
                    </div>
                </div>
                <!-- X (틀린/나쁜) 쪽 -->
                <div class="ox-column">
                    <div class="ox-column-header x-header">
                        <span class="ox-header-marker">❌</span>
                        <h3 style="margin: 0;">{{X_TITLE}}</h3>
                    </div>
                    <div class="ox-column-body">
                        {{X_ITEMS}}
                    </div>
                </div>
            </div>
        </div>
        {{BOTTOM_TAKEAWAY_HTML}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
