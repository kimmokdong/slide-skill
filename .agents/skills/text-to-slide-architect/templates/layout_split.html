<!-- 레이아웃: 좌우 분할 (Split Layout) -->
<section>
    <div class="slide-container">
        <div class="slide-header">
            <h2>{{TITLE}}</h2>
        </div>
        <div class="split-layout">
            <div class="left">
                {{#if BODY}}
                <p>{{BODY}}</p>
                {{/if}}
                {{#if BULLET_ITEMS}}
                <ul class="bullet-list">
                    {{BULLET_ITEMS}}
                </ul>
                {{/if}}
            </div>
            <div class="right">
                <div class="screenshot-frame browser-frame" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                    <div class="frame-dots">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                    </div>
                    {{#if IMAGE_SRC}}
                    <img src="{{IMAGE_SRC}}" alt="{{TITLE}}" class="screenshot-img">
                    {{else}}
                    <div class="placeholder-img-content" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.02); color: var(--color-text-secondary); padding: 1.5em; text-align: center; height: 100%; min-height: 250px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image" style="opacity: 0.4; margin-bottom: 0.5em;"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                        <span style="font-size: 0.75em; opacity: 0.6; font-weight: 500;">예상 결과 화면</span>
                    </div>
                    {{/if}}
                </div>
            </div>
        </div>
        {{BOTTOM_TAKEAWAY_HTML}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
