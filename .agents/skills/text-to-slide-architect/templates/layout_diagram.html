<!-- 레이아웃: 다이어그램 (Mermaid SVG) -->
<section>
    <div class="slide-container">
        <div class="slide-header">
            <h2>{{TITLE}}</h2>
        </div>
        <div class="slide-body">
            <div class="diagram-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%;">
                <img src="{{DIAGRAM_SRC}}" alt="{{TITLE}}" style="max-height: 80%; max-width: 100%; object-fit: contain;">
                {{#if DIAGRAM_CAPTION}}
                <p class="caption" style="text-align: center; font-size: 0.75em; opacity: 0.7; margin-top: 0.5em;">{{DIAGRAM_CAPTION}}</p>
                {{/if}}
            </div>
        </div>
        {{BOTTOM_TAKEAWAY_HTML}}
    </div>
    <aside class="notes">{{SPEAKER_NOTES}}</aside>
</section>
